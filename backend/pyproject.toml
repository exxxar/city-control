[tool.poetry]
name = "city-under-control-backend"
version = "0.1.0"
description = "Municipal civic-tech service backend"
authors = ["City Under Control Team"]
package-mode = false  # <--- ДОБАВЬТЕ ЭТУ СТРОКУ

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.1.6"}
alembic = "^1.13.1"
pymysql = "^1.1.0"
cryptography = "^42.0.5"
pydantic = {extras = ["email"], version = "^2.6.3"}
pydantic-settings = "^2.2.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
bcrypt = "4.0.1"  # <--- ДОБАВЬТЕ ЭТУ СТРОКУ (жесткая фиксация версии)
celery = {extras = ["redis"], version = "^5.3.6"}
redis = "^5.0.1"
pusher = "^3.3.2"
python-docx = "^1.1.0"
boto3 = "^1.34.51"
httpx = "^0.27.0"
loguru = "^0.7.2"
qrcode = "^7.4.2"
Pillow = "^10.2.0"
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"